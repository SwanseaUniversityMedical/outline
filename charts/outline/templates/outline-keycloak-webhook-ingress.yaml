{{- if and .Values.keycloakWebhook.enabled .Values.keycloakWebhook.ingress.enabled (not .Values.ingress.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: outline-keycloak-webhook
  namespace: {{ .Release.Namespace }}

  annotations:
    outline.ukserp.ac.uk/component: "outline-keycloak-webhook-ingress"
    {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.keycloakWebhook.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  labels:
    component: outline-keycloak-webhook-ingress
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}
    chart: {{ include "outline.labels.chart" . }}
    heritage: {{ .Release.Service }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.keycloakWebhook.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

spec:
  {{- with .Values.keycloakWebhook.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}

  rules:
  - host: {{ .Values.keycloakWebhook.ingress.host }}
    http:
      paths:
      - path: "/webhooks"
        pathType: Prefix
        backend:
          service:
            name: outline-keycloak-webhook
            port:
              number: {{ .Values.keycloakWebhook.service.port }}

  {{- if .Values.keycloakWebhook.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.keycloakWebhook.ingress.host }}
    secretName: {{ .Values.keycloakWebhook.ingress.tls.secretName }}
  {{- end }}
{{- end }}
